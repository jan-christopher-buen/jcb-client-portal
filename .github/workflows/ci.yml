name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jcb_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: jcb_portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jcb_ci -d jcb_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jcb_ci:ci_only_password@localhost:5432/jcb_portal_dev
      TEST_DATABASE_URL: postgresql://jcb_ci:ci_only_password@localhost:5432/jcb_portal_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
  ui:
    name: Browser UI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @jcb/contracts
      - name: Install isolated Playwright and Chromium
        timeout-minutes: 5
        run: |
          browser_root="$(mktemp -d "$RUNNER_TEMP/jcb-browser-ui.XXXXXX")"
          echo "JCB_BROWSER_TOOL_ROOT=$browser_root" >> "$GITHUB_ENV"
          export PLAYWRIGHT_BROWSERS_PATH="$browser_root/browsers"
          npm install --prefix "$browser_root/tooling" --no-save --package-lock=false --ignore-scripts playwright@1.64.0
          node "$browser_root/tooling/node_modules/playwright/cli.js" install --with-deps --no-shell chromium
          export JCB_PLAYWRIGHT_MODULE="$browser_root/tooling/node_modules/playwright/index.mjs"
          echo "JCB_PLAYWRIGHT_MODULE=$JCB_PLAYWRIGHT_MODULE" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          node --input-type=module -e 'import { pathToFileURL } from "node:url"; const { chromium } = await import(pathToFileURL(process.env.JCB_PLAYWRIGHT_MODULE)); console.log("JCB_BROWSER_EXECUTABLE=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Run all 48 UI regressions sequentially
        timeout-minutes: 8
        run: npm run test:ui
      - name: Remove isolated browser tooling
        if: always()
        run: |
          case "${JCB_BROWSER_TOOL_ROOT:-}" in
            "$RUNNER_TEMP"/jcb-browser-ui.*) rm -rf -- "$JCB_BROWSER_TOOL_ROOT" ;;
            "") ;;
            *) echo "Unexpected browser tooling path" >&2; exit 1 ;;
          esac
